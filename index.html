<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thư viện truyện</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" id="sharedDefs"></svg>

<header class="appbar gut">
  <div class="inner">
    <a class="brand" href="#thu-vien"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="#f2c76e" stroke-width="1.5" stroke-dasharray="3 2"/><path d="M12 4l1.8 6.2L20 12l-6.2 1.8L12 20l-1.8-6.2L4 12l6.2-1.8z" fill="#f2c76e"/></svg>Thư viện truyện</a>
    <nav class="crumbs" id="crumbs" aria-label="Vị trí"></nav>
    <div class="bar-nav" id="barNav"></div>
  </div>
</header>

<main class="inner gut">
  <!-- Màn 1: Thư viện -->
  <section class="view" id="vHome">
    <div class="feature" id="feature"></div>
    <div class="shelf-head"><h2 class="h-sec">Kệ truyện</h2><span class="meta" id="libCount"></span></div>
    <div class="shelf" id="shelf"></div>
  </section>

  <!-- Màn 2: Bản đồ -->
  <section class="view" id="vMap" hidden>
    <div class="map-layout">
      <figure class="map-box" style="margin:0">
        <svg id="map" viewBox="0 0 820 960" role="img" aria-label="Bản đồ các thế giới và đường hầm không gian"></svg>
        <figcaption class="legend">
          <span><i style="background:var(--tunnel)"></i>Đường hầm giữa các giới</span>
          <span><i style="background:var(--gold)"></i>Đường hầm lên cấp cao hơn</span>
        </figcaption>
      </figure>
      <aside class="side">
        <div><span class="eyebrow">Bản đồ thế giới</span><h1 id="storyTitle"></h1></div>
        <div class="stats" id="stats"></div>
        <div class="panel preview" id="preview"></div>
        <div class="panel"><div class="sec"><h3>Tất cả thế giới theo tầng</h3></div><div id="tierList" class="ladder"></div></div>
      </aside>
    </div>
  </section>

  <!-- Màn hồ sơ: nhân vật / hành trình / công pháp -->
  <section class="view" id="vInfo" hidden>
    <header class="w-head"><span class="eyebrow">Hồ sơ truyện</span><h1 id="infoTitle"></h1><p class="sub" id="infoSub"></p></header>
    <nav class="tabs" id="infoTabs" aria-label="Hồ sơ"></nav>
    <div id="infoBody" class="view"></div>
  </section>

  <!-- Màn 3: Thế giới -->
  <section class="view" id="vWorld" hidden>
    <header class="w-head"><span class="eyebrow" id="wTier"></span><h1 id="wName"></h1><p class="sub" id="wAbout"></p></header>
    <figure class="w-map">
      <div class="w-scroll"><svg id="scene" viewBox="0 0 1000 640" role="img"></svg></div>
      <div class="realm-badge" id="realmBadge"></div>
      <figcaption class="place-legend" id="placeLegend"></figcaption>
    </figure>
    <div class="places">
      <aside class="panel place-detail" id="placeDetail" aria-live="polite"></aside>
      <div class="place-groups">
        <div class="dossier-head"><h2 class="h-sec">Quốc gia, gia tộc &amp; thế lực</h2><span class="meta" id="placeCount"></span></div>
        <div id="placeGroups" class="pgs"></div>
      </div>
    </div>
    <div class="dossier-head"><h2 class="h-sec">Thế giới này như thế nào</h2><span class="meta">Theo lời truyện · bấm số chương để đọc nguyên văn</span></div>
    <div class="dossier" id="dossier"></div>
    <div class="w-grid">
      <div class="a-info view" style="gap:20px">
        <div class="sec"><h3>Thông tin cơ bản</h3><dl class="facts" id="wFacts"></dl></div>
        <div class="sec"><h3 id="routeHead"></h3><div class="chips" id="wRoute"></div><p class="meta" id="wRouteMeta"></p></div>
        <div class="sec"><h3>Thế giới kề bên</h3><div class="chips" id="wNear"></div></div>
        <div class="sec"><h3>Nhân vật ở đây</h3><div class="chips" id="wPeople"></div></div>
        <div class="sec"><h3>Sự kiện ở đây</h3><ul class="evs" id="wEvents"></ul></div>
      </div>
      <div class="a-tower sec">
        <h3>Tháp cảnh giới <span id="towerBadge"></span></h3>
        <p class="meta" id="realmRange"></p>
        <div class="ladder" id="ladder"></div>
        <button class="toggle" id="toggleAll" type="button"></button>
      </div>
      <aside class="a-detail panel" id="realmPanel" aria-live="polite"></aside>
    </div>
  </section>
</main>

<!-- Thứ tự nạp quan trọng: dữ liệu → tiện ích → hình vẽ → ứng dụng -->
<script src="js/canh-gioi.js"></script>
<script src="js/truyen/thai-co-long-tuong-quyet.js"></script>
<script src="js/truyen/thai-co-long-tuong-quyet.chuong.js"></script>
<script src="js/truyen/thai-co-long-tuong-quyet.quy-mo.js"></script>
<script src="js/truyen/thai-co-long-tuong-quyet.dia-danh.js"></script>
<script src="js/truyen/thai-co-long-tuong-quyet.ho-so.js"></script>
<script src="js/tien-ich.js"></script>
<script src="js/hinh-ve.js"></script>
<script src="js/ban-do-vung.js"></script>
<script src="js/ho-so.js"></script>
<script src="js/app.js"></script>
</body>
</html>
