<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thư viện truyện</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
/* Thanh điều hướng cố định trên cùng. Thư viện: truyện nổi bật + kệ truyện. Bản đồ: bản đồ lớn + khung xem trước. Thế giới: cảnh quan làm hero, dưới chia 3 cột (thông tin · tháp cảnh giới · đột phá). */
:root{
  --space:#0a0b22; --bar:rgba(10,11,34,.82); --ink:#ece8f7; --muted:#a19dc6;
  --gold:#f2c76e; --tunnel:#8fd6ff; --line:rgba(170,165,230,.18); --panel:rgba(22,24,62,.72); --well:rgba(5,6,24,.55);
  --display:"Cormorant Garamond","Noto Serif",Georgia,serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
:root{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
html,body{background:var(--space);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.55;min-height:100%;
  background:radial-gradient(1200px 700px at 70% -10%,#24205a 0%,transparent 60%),radial-gradient(900px 600px at 0% 100%,#122a4a 0%,transparent 60%),var(--space)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--space)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1320px;margin:0 auto}

/* Thanh điều hướng */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bar);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.appbar .inner{display:flex;align-items:center;gap:14px;min-height:54px;flex-wrap:wrap;padding-block:6px}
.brand{display:flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none;font-family:var(--display);font-weight:700;font-size:20px;white-space:nowrap}
.brand svg{width:22px;height:22px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--muted);min-width:0}
.crumbs a{color:var(--muted);text-decoration:none}.crumbs a:hover{color:var(--ink)}
.crumbs b{color:var(--ink);font-weight:500}
.crumbs .sep{opacity:.5}
.bar-nav{margin-left:auto;display:flex;gap:6px}
.bar-nav a{font-size:13px;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;white-space:nowrap}
.bar-nav a:hover{border-color:var(--gold)}

main.inner{padding-block:24px 56px}
.view{display:flex;flex-direction:column;gap:24px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--tunnel)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,5.4vw,60px);line-height:1.02;margin:0;color:var(--gold);letter-spacing:.01em;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance}
.h-sec{font-size:28px;color:var(--ink)}
.sub{color:var(--muted);margin:0;max-width:60ch}
.meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.sec{display:flex;flex-direction:column;gap:8px;min-width:0}
.sec h3{margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec p{margin:0;max-width:64ch}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chip{font:500 13px var(--body);color:var(--ink);background:rgba(143,214,255,.08);border:1px solid rgba(143,214,255,.28);border-radius:8px;padding:4px 9px;cursor:pointer;text-decoration:none}
.chip.gold{background:rgba(242,199,110,.08);border-color:rgba(242,199,110,.4)}
.chip.cur{background:var(--gold);color:#241a05;border-color:var(--gold)}
.chip:hover{border-color:var(--ink)}
.arrow{color:var(--muted);font-size:12px}.arrow.up{color:var(--gold)}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 14px var(--body);text-decoration:none;border-radius:10px;padding:10px 16px;border:1px solid var(--line);color:var(--ink);background:rgba(255,255,255,.04);cursor:pointer}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#241a05}
.btn:hover{border-color:var(--gold)}
.badge{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:1px 7px;border:1px solid}
.badge.src{color:#8ff0b8;border-color:rgba(143,240,184,.45)}
.badge.guess{color:#f5c98a;border-color:rgba(245,201,138,.45)}
.badge.web{color:#9fd0ff;border-color:rgba(159,208,255,.45)}
.chref{display:inline-block;font-size:12px;font-variant-numeric:tabular-nums;color:var(--tunnel);text-decoration:none;border-bottom:1px dotted rgba(143,214,255,.5);margin-right:6px}
a.chref:hover{color:var(--ink)}
.refs{display:flex;flex-wrap:wrap;gap:2px 0;margin-top:2px}
.dossier{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card h3{margin:0;font-family:var(--display);font-size:22px;font-weight:700;color:var(--ink)}
.card p{margin:0}
.card.lp{grid-column:1/-1;border-color:rgba(242,199,110,.35)}
.quote{grid-column:1/-1;border-left:3px solid var(--gold);background:linear-gradient(90deg,rgba(242,199,110,.1),transparent);border-radius:0 14px 14px 0;padding:14px 18px;display:flex;flex-direction:column;gap:6px}
.quote q{font-family:var(--display);font-size:clamp(20px,2.4vw,26px);line-height:1.3;color:#f6e7c4;font-style:italic;quotes:"“" "”"}
.dossier-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
textarea{width:100%;box-sizing:border-box;min-height:90px;resize:vertical;font:14px/1.5 var(--body);color:var(--ink);background:var(--well);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea:focus{outline:2px solid var(--tunnel);outline-offset:1px}
.saved{font-size:12px;color:var(--muted);min-height:1em}
a:focus-visible,button:focus-visible,.world:focus-visible,.portal:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.stats{display:flex;gap:24px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.stat b{display:block;font-weight:600;font-size:26px;line-height:1.1}
.stat span{font-size:12px;color:var(--muted);letter-spacing:.04em}

/* Thư viện */
.feature{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);border:1px solid var(--line);border-radius:18px;overflow:hidden;background:linear-gradient(120deg,rgba(36,32,90,.55),rgba(10,11,34,.4))}
.feature-text{padding:clamp(20px,4vw,44px);display:flex;flex-direction:column;gap:16px;justify-content:center;min-width:0}
.feature-art{display:block;min-width:0;border-left:1px solid var(--line)}
.feature-art svg{display:block;width:100%;height:100%;min-height:280px}
.actions{display:flex;flex-wrap:wrap;gap:10px}
@media (max-width:820px){.feature{grid-template-columns:minmax(0,1fr)}.feature-art{order:-1;border-left:0;border-bottom:1px solid var(--line)}.feature-art svg{aspect-ratio:4/3;height:auto;min-height:0}}
.shelf-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.cover{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#070818;color:var(--ink);text-decoration:none;transition:transform .25s,border-color .25s}
.cover:hover{transform:translateY(-3px);border-color:rgba(242,199,110,.6)}
.cover svg{display:block;width:100%;height:auto;aspect-ratio:3/4}
.cover .cap{padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line)}
.cover .t{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.1;color:var(--gold)}
.cover.empty{border-style:dashed;justify-content:center;align-items:center;text-align:center;padding:24px 18px;background:transparent;color:var(--muted);gap:8px;min-height:240px}
.cover.empty .plus{font-family:var(--display);font-size:46px;line-height:1}
.cover.empty:hover{transform:none;border-color:var(--line)}

/* Bản đồ */
.map-layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.map-layout{grid-template-columns:minmax(0,1fr)}}
.map-box{margin:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#070818}
.map-box svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:16px;padding:10px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:26px;height:4px;border-radius:4px;vertical-align:middle;margin-right:6px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);display:flex;flex-direction:column;gap:16px}
@media (max-width:900px){.side{position:static}}
.preview{min-height:210px}
.preview .pname{font-size:32px;line-height:1.05;color:var(--ink)}
.world{cursor:pointer}.world:focus{outline:none}
.world .hit{fill:transparent}
.world:hover .art,.world:focus-visible .art,.world.hl .art{filter:url(#hover)}
.world:hover .label,.world.hl .label{fill:var(--gold)}
.label{font:600 16px var(--body);fill:#e7e4f6;paint-order:stroke;stroke:#070818;stroke-width:4px;stroke-linejoin:round;text-anchor:middle}
.tunnel .core{fill:none;stroke-width:2.2;stroke-dasharray:7 7;stroke-linecap:round;animation:flow 1.6s linear infinite}
.tunnel .halo{fill:none;stroke-width:9;opacity:.28}
.tunnel.on .core{stroke:#fff;stroke-width:3}.tunnel.on .halo{opacity:.7}
@keyframes flow{to{stroke-dashoffset:-28}}

/* Thế giới */
.w-hero{position:relative;margin:0;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#070818}
.w-hero svg{display:block;width:100%;height:auto}
.w-title{position:absolute;left:0;right:0;bottom:0;padding:clamp(16px,3vw,32px);padding-top:90px;background:linear-gradient(180deg,transparent,rgba(5,6,18,.82) 55%);display:flex;flex-direction:column;gap:6px;pointer-events:none}
.w-title .sub{color:#d5d1ee}
@media (max-width:700px){.w-title{position:static;background:#0c0d2a;padding-top:16px}}
.portal{cursor:pointer}
.portal:hover ellipse:first-child{stroke-width:4}
.portal text{font:600 15px var(--body);fill:#eef;paint-order:stroke;stroke:#070818;stroke-width:4px;text-anchor:middle}
.w-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1fr) minmax(0,1.1fr);grid-template-areas:"info tower detail";gap:22px;align-items:start}
@media (max-width:1100px){.w-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"info info" "tower detail"}}
@media (max-width:720px){.w-grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"info" "tower" "detail"}}
.a-info{grid-area:info}.a-tower{grid-area:tower}.a-detail{grid-area:detail}
.facts{margin:0;display:grid;grid-template-columns:minmax(0,1fr);gap:0}
@media (max-width:1100px) and (min-width:721px){.facts{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:20px}}
.facts div{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.facts dt{font-size:12px;color:var(--muted);letter-spacing:.04em}
.facts dd{margin:0;font-weight:500}
.ladder{display:flex;flex-direction:column;gap:14px}
.grp{display:flex;flex-direction:column;gap:6px}
.grp-name{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.grp-name i{width:10px;height:10px;border-radius:50%;flex:none}
.rungs{display:flex;flex-direction:column-reverse;gap:4px}
.rung{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;text-align:left;font:500 14px var(--body);color:var(--ink);background:rgba(255,255,255,.03);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:8px;padding:8px 12px;cursor:pointer}
.rung:hover{background:rgba(255,255,255,.07)}
.rung[aria-pressed="true"]{background:rgba(242,199,110,.12);border-color:var(--gold);border-left-color:var(--c)}
.rung .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;width:2ch;text-align:right}
.rung .lv{font-size:12px;color:var(--muted)}
.rung.out{opacity:.45}
.toggle{align-self:flex-start;font:500 13px var(--body);color:var(--tunnel);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.a-detail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
@media (max-width:720px){.a-detail{position:static}}
.rname{font-size:40px;line-height:1.02;color:var(--ink)}
.rname small{font-family:var(--body);font-size:16px;color:var(--muted);font-weight:400;margin-left:6px}
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px}
.flow span{padding:3px 8px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.flow span.me{color:#241a05;background:var(--gold);border-color:var(--gold);font-weight:600}
.dots{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.dots i{height:8px;border-radius:4px;background:var(--c);opacity:.25}
.dots i:nth-child(-n+1){opacity:1}
.ticks{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:3px}
.ticks i{aspect-ratio:1;border-radius:2px;background:var(--c);opacity:.3}
.ticks i:nth-child(11n){opacity:.7}
.lvl-cap{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.step{display:flex;flex-direction:column;gap:6px;background:var(--well);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.step .to{font-size:13px;color:var(--muted)}.step .to b{color:var(--gold);font-weight:600}
.kiep{color:#ffb4a1}
.nav2{display:flex;justify-content:space-between;gap:8px}
.nav2 button{font:500 13px var(--body);color:var(--ink);background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.nav2 button:disabled{opacity:.35;cursor:default}
@media (prefers-reduced-motion:reduce){.tunnel .core{animation:none}.cover{transition:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" id="sharedDefs"></svg>

<header class="appbar gut">
  <div class="inner">
    <a class="brand" href="#thu-vien"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="#f2c76e" stroke-width="1.5" stroke-dasharray="3 2"/><path d="M12 4l1.8 6.2L20 12l-6.2 1.8L12 20l-1.8-6.2L4 12l6.2-1.8z" fill="#f2c76e"/></svg>Thư viện truyện</a>
    <nav class="crumbs" id="crumbs" aria-label="Vị trí"></nav>
    <div class="bar-nav" id="barNav"></div>
  </div>
</header>

<main class="inner gut">
  <!-- Màn 1: Thư viện -->
  <section class="view" id="vHome">
    <div class="feature" id="feature"></div>
    <div class="shelf-head"><h2 class="h-sec">Kệ truyện</h2><span class="meta" id="libCount"></span></div>
    <div class="shelf" id="shelf"></div>
  </section>

  <!-- Màn 2: Bản đồ -->
  <section class="view" id="vMap" hidden>
    <div class="map-layout">
      <figure class="map-box" style="margin:0">
        <svg id="map" viewBox="0 0 820 960" role="img" aria-label="Bản đồ các thế giới và đường hầm không gian"></svg>
        <figcaption class="legend">
          <span><i style="background:var(--tunnel)"></i>Đường hầm giữa các giới</span>
          <span><i style="background:var(--gold)"></i>Đường hầm lên cấp cao hơn</span>
        </figcaption>
      </figure>
      <aside class="side">
        <div><span class="eyebrow">Bản đồ thế giới</span><h1 id="storyTitle"></h1></div>
        <div class="stats" id="stats"></div>
        <div class="panel preview" id="preview"></div>
        <div class="panel"><div class="sec"><h3>Tất cả thế giới theo tầng</h3></div><div id="tierList" class="ladder"></div></div>
      </aside>
    </div>
  </section>

  <!-- Màn 3: Thế giới -->
  <section class="view" id="vWorld" hidden>
    <figure class="w-hero">
      <svg id="scene" viewBox="0 0 800 440" role="img"></svg>
      <figcaption class="w-title"><span class="eyebrow" id="wTier"></span><h1 id="wName"></h1><p class="sub" id="wAbout"></p></figcaption>
    </figure>
    <div class="dossier-head"><h2 class="h-sec">Thế giới này như thế nào</h2><span class="meta">Theo lời truyện · bấm số chương để đọc nguyên văn</span></div>
    <div class="dossier" id="dossier"></div>
    <div class="w-grid">
      <div class="a-info view" style="gap:20px">
        <div class="sec"><h3>Thông tin cơ bản</h3><dl class="facts" id="wFacts"></dl></div>
        <div class="sec"><h3 id="routeHead"></h3><div class="chips" id="wRoute"></div><p class="meta" id="wRouteMeta"></p></div>
        <div class="sec"><h3>Thế giới kề bên</h3><div class="chips" id="wNear"></div></div>
      </div>
      <div class="a-tower sec">
        <h3>Tháp cảnh giới <span id="towerBadge"></span></h3>
        <p class="meta" id="realmRange"></p>
        <div class="ladder" id="ladder"></div>
        <button class="toggle" id="toggleAll" type="button"></button>
      </div>
      <aside class="a-detail panel" id="realmPanel" aria-live="polite"></aside>
    </div>
  </section>
</main>

<!-- Thứ tự nạp quan trọng: dữ liệu → tiện ích → hình vẽ → ứng dụng -->
<script>
/* ===== Hệ thống cảnh giới =====
   Nguồn của từng mục: t = theo lời truyện (có số chương), w = bách khoa trên web, d = diễn giải từ tên gọi.
   lf = chương Lâm Phong đột phá/đạt cảnh giới này. */
const GROUPS=[
  {id:'nhan',name:'Nhân cảnh',han:'人境',c:'#8fd6ff'},
  {id:'dia',name:'Địa cảnh',han:'地境',c:'#7be0a8'},
  {id:'than',name:'Thần cảnh',han:'神境',c:'#f2c76e'},
  {id:'chuande',name:'Chuẩn Đế',han:'准帝',c:'#ff9f6e'},
  {id:'de',name:'Đế cảnh',han:'帝境 · Đại Đế',c:'#ff7a92'},
  {id:'tien',name:'Tiên cảnh',han:'仙境',c:'#c9a6ff'},
  {id:'thanh',name:'Thánh cảnh',han:'圣境',c:'#f4f1ff'},
  {id:'sieuviet',name:'Siêu việt & trên nữa',han:'超越',c:'#9ef0ff'}
];
const R=(id,g,name,han,lv,trait,how,o)=>Object.assign({id,g,name,han,lv,trait,how,tLv:'d',tTrait:'d',tHow:'d',ch:[]},o||{});
const REALMS=[
  R('vogia','nhan','Võ Giả','武者','10 trọng thiên',
    'Thiên Võ đại lục là thế giới của Võ Giả, mỗi Võ Giả đều có võ hồn riêng. Lâm Phong mang thôn phệ võ hồn cực hiếm, hấp thu thiên địa năng lượng nhanh hơn người khác rất nhiều.',
    'Tích lũy qua 10 trọng thiên. Lâm Phong từng tụt từ lục trọng thiên xuống tam trọng thiên vì hút độc hỏa cho Tô Nguyệt Tịch, sau đó đột phá lên Võ Giả 10 trọng thiên.',

        ['Bảo vật','Thiên Chi Giới có lực hút kỳ lạ với pháp bảo và thiên tài địa bảo của chư thiên. Trong quá trình thai nghén, lượng lớn bảo bối tụ về đây, và chính nó cũng sinh ra những thứ cực kỳ quý.',[8381]],
        ['Thiên chi thần','Tương truyền nơi đây sinh ra một "thiên chi thần thân thể", vừa sinh đã ở cấp Chúa Sáng Thế. Nếu đủ thời gian, nó có thể thành kẻ khai hoang thứ hai.',[8381]],
        ['Thông đạo & tranh đoạt','Có nhiều thông đạo nối tới các thời không khác nhau, có lúc truyền ra đạo âm. Thái Tây tộc trấn phong nhiều thông đạo, những thông đạo khó trấn phong thì có vương tộc canh giữ. Các thế lực cổ xưa nhất tranh đoạt nơi này, và việc Thái Tây tộc bị diệt có liên quan lớn tới nó.',[8381]]]},
    {id:'hoangchi',name:'Hoang Chi Địa',tier:4,x:685,y:140,kind:'ruins',type:'Vùng đất',r:['taovatchu','khaihoang'],sym:'Đảo đá xám với các cột phế tích chìm trong sương.',

      quote:['Ngươi sau khi ngã xuống, kẻ khai hoang cũng vẫn lạc ở rồi cái này địa phương sao?',8851],
      secs:[['Hiểm địa','Quân đoàn hoang chi âm binh hoạt động ở đây, đến cường giả cũng tránh đối đầu trực diện.',[8851]],
        ['Bí mật','Có một bí địa có thể chứa máu bản nguyên của kẻ khai hoang. Lâm Phong nghi rằng một kẻ khai hoang đã vẫn lạc ở đây.',[8851]],
        ['Lâm Phong tại đây','Lâm Phong đi cùng Kỳ Liên sơn chủ, phá việc lớn của hóa thân "trời xanh con" nên bị kẻ này thề truy sát khắp trời đất.',[8851]]]},
    {id:'longgioi',name:'Long Giới',tier:3,x:205,y:362,kind:'dragon',type:'Giới',r:['diatien','chantien'],sym:'Dãy núi xanh ngọc, có rồng vàng uốn lượn.',
      about:'Thế giới của Long tộc, một trong mười đại thế giới đứng đầu ba ngàn đại thế giới.',
      quote:['Long giới thế nhưng là ba ngàn đại thế giới bên trong sắp xếp tên top 10 đại thế giới',5698],
      secs:[['Cư dân','Long tộc thuần huyết rất hiếm, phần lớn là long tộc tạp huyết. Chân Long phải trải qua trăm lần thiên kiếp mới xưng bá được Long Giới.',[5698,3207]],
        ['Thế lực','Sau khi lão tổ tự phong của Long giới ra ngoài, các cường giả tranh ngôi Long giới chi chủ, vì chỉ người này mới câu thông được bản nguyên thế giới. Long giới chia thành năm phe: Kim Long, Dực Long, Thiên Long, Tà Long và Cổ Long.',[5698]],
        ['Hiểm địa','Long giới đang rơi vào thời kỳ đại loạn, nhiều thế lực đã bỏ đi. Vùng biển của Long giới rất nguy hiểm. Về sau thông đạo Minh giới mở rộng và Thiên Phủ minh quân kéo đến.',[5698,5753,5879]],
        ['Lâm Phong tại đây','Lâm Phong tìm hiểu tình hình rồi đi tới Long giới. Sau này có tin đồn có người đã thống nhất Long giới.',[5696,5698,6014]]]},
    {id:'thiengioi',name:'Thiên Giới (nhiều tầng)',tier:3,x:408,y:362,kind:'heaven',type:'Giới nhiều tầng',r:['thientien','chantien'],rGuess:true,sym:'Nhiều tầng mây chồng lên nhau, trên có đền vàng.',

        ['Bảo vật & truyền thừa','Có tấm bia đá từ Thiên Giới rơi xuống phàm trần, nơi truyền thừa của Thanh Loan Tôn Giả, và một vật phong ấn Thiên giới bản nguyên.',[2589,2938,5502]],
        ['Nhân vật','Anh Thanh Tuyết của Anh gia Thiên giới, các tiên tử Thiên Giới, và một nữ quỷ tiên đã phi thăng lên Thiên giới.',[2637,4606,5132]],
        ['Cường giả','Ngay ở Thiên giới, Chân Tiên cũng đã rất khó xuất hiện.',[4504]]]},
    {id:'battu',name:'Bất Tử Giới',tier:3,x:612,y:362,kind:'tree',type:'Đại thế giới',r:['thande','diatien'],sym:'Đảo trắng xanh với một cây sáng bạc.',

      secs:[['Nguồn gốc','Ba ngàn đại thế giới do thiên đạo diễn hóa, nhưng các cường giả có vai trò then chốt trong quá trình đó. Cái tên "Bất Tử Giới" do bảy thánh của Bất Tử gia tộc đặt. Muốn tới đây phải theo tinh không cổ đồ.',[2785,3286]],
        ['Thế lực','Cửu Linh Tông, Thánh Tà Tông (một trong bảy đại thế lực tà đạo), Yêu tộc, Bất Tử giới thập kiệt như Vũ Tiên Vương, và Bất Tử giới chủ.',[3632,4140,4778,5051,4959]],
        ['Đặc điểm','Bất Tử giới có rất nhiều cường giả, nhưng Chân Tiên vẫn hiếm. Bất Tử gia tộc ít nổi danh, chỉ xuất hiện ở vài thế giới như Cửu Châu, Bất Tử Giới, Thiên Giới.',[2719,4504,4550]],
        ['Lâm Phong tại đây','Lâm Phong bị truy sát vì mang huyết mạch tội huyết, gây chấn động Bất Tử giới, rồi đánh trọng thương Bất Tử giới chủ.',[4504,4587,4959]]]},
    {id:'cuuchau',name:'Cửu Châu đại thế giới',tier:2,x:140,y:525,kind:'nine',type:'Đại thế giới',r:['huthan','cuthan'],sym:'Chín mảnh đất xanh nhỏ xếp thành lưới 3 × 3.',
      about:'Cửu Châu được coi là khởi điểm của vũ trụ, và cả vũ trụ này mang tên Cửu Châu vũ trụ.',
      quote:['Cửu châu là vũ trụ khởi điểm!',4087],
      secs:[['Nguồn gốc','Trước vụ nổ lớn, giữa Hỗn Độn có một đại lục cổ xưa tên Cửu Châu. Vũ trụ nổ tung, Cửu Châu vỡ ra và diễn hóa thành ba ngàn đại thế giới cùng nhiều thế giới khác. Cửu Châu đại thế giới là phần còn lại sau vụ nổ.',[4087]],
        ['Trong tứ đại vũ trụ','Côn Luân phân hóa thành bốn vũ trụ: Côn Luân, Cửu Châu, Tịch Diệt, Thời Gian. Cửu Châu vũ trụ giống Côn Luân nhất, từ nhân văn địa lý tới chủng tộc tu sĩ.',[4087]],
        ['Thế lực','Hồng Trần Tiên Tôn là đệ nhất cường giả, một vị Đại Đế. Ngoài ra có Âm Dương Hợp Hoan Tông, Vạn Hoa Lâu, Cửu Châu tiên quốc, Bắc Minh sơn, và đại đế của Cổ Thần Tộc.',[2436,1717,1987,2431,2739]],
        ['Biến cố','Vạn tộc giáng lâm vì cơ duyên ở Nam Tiên Hải Vực, khinh miệt nhân tộc Cửu Châu và tàn sát sinh linh vô tội. Hải tặc cũng hoành hành.',[2589,2968,2739]],
        ['Lâm Phong tại đây','Lâm Phong nhận được cơ hội rời Thiên Võ đến Cửu Châu. Hắn giết con của Thiên Yêu Hoàng để báo thù cho Cửu Châu.',[839,2968]]]},
    {id:'phongtruc',name:'Phóng Trục (Long Môn)',tier:2,x:315,y:528,kind:'gate',type:'Đại thế giới',r:['chuande','deton'],sym:'Núi đá xám, giữa có cổng vòm vàng (Long Môn).',
      about:'Trục xuất (Phóng Trục) đại thế giới, nơi tín ngưỡng lực giúp Lâm Phong bước lên Đại Đế. Long Môn là thế lực của chính Lâm Phong.',
      quote:['Năm đó Lâm Phong đột phá đại đế cảnh giới hấp thu trục xuất đại thế giới một bộ phận tín ngưỡng lực.',4187],
      secs:[['Tín ngưỡng','Lâm Phong hấp thu tín ngưỡng lực của Trục xuất đại thế giới để thành Đại Đế. Thần miếu của hắn còn có ở Thiên Võ đại lục, Cửu Châu, Thiên Thánh đại thế giới và Huyền Vực biển sao.',[4187]],
        ['Long Môn','Tên Long Môn mang ý "cá vượt long môn". Lâm Phong lập Long Môn lần đầu ở Thanh Long học phủ, sau lập lại trên đảo Long Môn ở Cổ Hoang hải vực. Theo bách khoa, hắn là vực chủ Long Môn vực.',[262,1964,6574]],
        ['Thần thông cùng tên','"Đại phóng trục thuật" của Nữ Đế dùng trục xuất chi lực ném kẻ địch và vật thể vào dòng thời không chảy ngược, hoặc vào các không gian song song. Lâm Phong cũng học dùng thuật này.',[1710,2654]]]},
    {id:'magioi',name:'Ma Giới',tier:2,x:498,y:528,kind:'demon',type:'Giới',r:['chantien','sieuviet'],sym:'Đảo đỏ đen mọc gai nhọn, trên trời có trăng máu.',

        ['Thế lực & nơi chốn','Ma Thiên vực, Thương Minh thành, các ma đầu như Si ma, Oán ma, Hận ma, và Ngũ Tu Nhân của Ma giới.',[5471,6014,6035]],
        ['Bảo vật','Ma giới bản nguyên, Ngũ đại chí bảo, Ma giới chi nguyên và tin tức về thiên hỏa.',[4287,6014,6076]],
        ['Cổ Ma giới','Một bảo vật ma đạo cực kỳ tà ác, nhìn lâu sẽ mất phương hướng. Về sau nó nhiều lần kéo Lâm Phong vào giấc mộng.',[551,6008,6024]],
        ['Lâm Phong tại đây','Vừa tới Ma giới, Lâm Phong đã thu phục Đại Ma Thiên và nắm Ma Thiên vực, làm kinh động nhiều thế lực.',[6014]]]},
    {id:'minhgioi',name:'Minh Giới',tier:2,x:672,y:528,kind:'nether',type:'Giới (tam giới)',r:['chanthan','thienthan'],sym:'Đảo tím sẫm với những luồng u khí phát sáng.',

      secs:[['Cấu trúc','Giống Thiên Giới có 33 trọng thiên, Minh giới cũng có 33 trọng Minh giới.',[3475]],
        ['Thế lực','Địa phủ mạnh nhất, âm binh thuộc về Địa phủ. Nhiều thế lực khác tuyển minh binh. Minh Hoàng là kẻ khai hoang duy nhất của Minh giới.',[2334,11034]],
        ['Vị thế','Minh giới vượt ba ngàn đại thế giới nhưng kém xa Thiên Giới, và từng thuộc quyền Thiên Giới cai quản.',[2589]],
        ['Lâm Phong tại đây','Lâm Phong hộ tống vong hồn qua thông đạo vào Minh giới (người ngoài nhìn thấy cảnh "âm binh mượn đường"), rồi trở thành sứ giả Minh giới.',[2334,2338]]]},
    {id:'cohoang',name:'Cổ Hoang hải vực',tier:2,x:165,y:685,kind:'sea',type:'Hải vực',r:['thanhoa','thienthan'],sym:'Vùng biển xanh, giữa nhô lên một mỏm đá.',

      secs:[['Vị trí','Nằm giữa Quy Khư hải vực và Nam Cực băng nguyên. Hung thú biển tụ tập nên đây là vùng không ai quản.',[1964]],
        ['Thế lực','Hỏa Hạt Đảo, Ác Giao đảo và Tán Tu Liên Minh.',[1964,2000,2106]],
        ['Lâm Phong tại đây','Lâm Phong chọn một đảo hoang làm đảo Long Môn. Đại lực Hải Ma xây tiên sơn và cung điện, Lâm Phong bày đại trận bảo vệ. Ác Giao đảo bị diệt, rồi Tán Tu Liên Minh đại diện các thế lực tới quy phục, Cổ Hoang hải vực được nhất thống.',[1964,2000,2106]]]},
    {id:'phetho',name:'Phế Thổ',tier:2,x:335,y:685,kind:'waste',type:'Vùng đất',r:['cuthan','thande'],sym:'Đất nâu nứt nẻ, chỉ còn một cây khô.',
      about:'Mộ địa của cường giả, đã tồn tại qua rất nhiều kỷ nguyên.',
      quote:['Nhân gian địa ngục không đủ để hình dung cái địa phương kia, nhưng cái địa phương kia, có nó tồn tại ý nghĩa',2883],
      secs:[['Đặc điểm','Phế Thổ nối với dị vực, Thiên Giới, Huyền Hoàng giới và cả Minh giới. Luật mạnh được yếu thua bị đẩy tới cực hạn, sinh linh từ đây đi ra mạnh đến khó tưởng tượng.',[2883,3311]],
        ['Lai lịch','Phế Thổ chứng kiến từng kỷ nguyên ra đời và hủy diệt, cất giữ vô số bí mật kỷ nguyên nên nhiều cường giả tìm cách vào.',[2883]],
        ['Sự kiện','Đại đế Quân Mạc Tiếu chết ở Phế Thổ. Ngạc Tổ suýt bước vào Cánh Cổng Vĩnh Sinh thì bị sinh linh Phế Thổ đánh trọng thương. Trớ chú oa oa (nguyền rủa nhóc con) đến từ đây.',[2883]],
        ['Lâm Phong tại đây','Lôi kiếp của Lâm Phong từng ngưng ra hư ảnh Phế Thổ. Hắn nhập Thánh Hoàng để áp chế sinh linh Phế Thổ, và về sau gặp hậu nhân tội huyết ở đây.',[3317,3665,6902]]]},
    {id:'toivuc',name:'Tội Vực',tier:2,x:492,y:685,kind:'sin',type:'Vực',r:['deton','tantien'],sym:'Đảo đỏ thẫm với các gai đỏ.',

      quote:['Tội vực so sánh đặc thù, chết đi quá nhiều tội huyết hậu nhân, ý chí của bọn hắn dung nhập tội vực bên trong.',4504],
      secs:[['Đặc điểm','Pháp tắc của Tội vực cảm ứng được huyết mạch tội huyết và có thể ngưng tụ ra cả một tôn Thánh Hoàng.',[4504]],
        ['Bảo vật','Tội huyết thạch, gồm Chân Long Tội Huyết Thạch và Bất Tử Tội Huyết Thạch.',[4462,4463,4464]],
        ['Thế lực','Tội huyết liên minh, cường giả tội huyết Diêm Hỗn Thiên, và một nhóm Chân Tiên ở Tội vực.',[4586,4789,5108]],
        ['Lâm Phong tại đây','Lâm Phong là con của Lâm Bại Thiên, mang huyết mạch tội huyết. Chúa tể đế huyết của hắn được gọi là "tội huyết chi vương". Tội huyết thức tỉnh khiến Tội vực dị biến và Bất Tử giới dậy sóng.',[4504]]]},
    {id:'cuuu',name:'Cửu U · Ác Ma thâm uyên',tier:2,x:655,y:685,kind:'abyss',type:'Vực sâu / địa ngục',r:['thanhoa','chanthan'],sym:'Một vực sâu đen, viền quanh là lửa.',

    poly(g,'14,2 30,-28 46,2','#7d8496');poly(g,'30,-28 46,2 34,2','#5b6273');poly(g,'26,-20 30,-28 34,-20','#e6e9f2');

function stars(parent,n,w,hh,seed){const r=rng(seed),g=el('g',{},parent);for(let i=0;i<n;i++){const v=r();el('circle',{cx:(r()*w).toFixed(1),cy:(r()*hh).toFixed(1),r:(v>.97?1.8:v*1.1+.2).toFixed(2),fill:v>.9?'#ffeccc':'#e8ecff',opacity:(.35+r()*.65).toFixed(2)},g)}return g}
function sparkle(g,x,y,s){s=s||7;poly(g,`${x},${y-s} ${x+s*.2},${y-s*.2} ${x+s},${y} ${x+s*.2},${y+s*.2} ${x},${y+s} ${x-s*.2},${y+s*.2} ${x-s},${y} ${x-s*.2},${y-s*.2}`,'#fff')}
</script>
<script>
/* ===== Trạng thái ===== */
let S,byId,adj,showAll=false,curWorld=null,curRealm=null;
function useStory(id){
  S=STORIES.find(s=>s.id===id);if(!S)return false;
  byId=Object.fromEntries(S.worlds.map(w=>[w.id,w]));
  adj=Object.fromEntries(S.worlds.map(w=>[w.id,[]]));S.links.forEach(([a,b])=>{adj[a].push(b);adj[b].push(a)});
  store.set('lastStory',id);return true;
}
const linkType=(a,b)=>{const l=S.links.find(([x,y])=>(x===a&&y===b)||(x===b&&y===a));return l&&l[2]==='up'?'up':'side'};
function route(from,to){const prev={[from]:null},q=[from];while(q.length){const u=q.shift();if(u===to)break;for(const v of adj[u])if(!(v in prev)){prev[v]=u;q.push(v)}}if(!(to in prev))return null;const p=[];for(let u=to;u!==null;u=prev[u])p.unshift(u);return p}
const go=h=>{location.hash=h};
const rangeOf=w=>[RIDX[w.r[0]],RIDX[w.r[1]]];
function bindOpen(g,fn){g.addEventListener('click',fn);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn()}})}

/* ===== Thanh điều hướng ===== */
function setBar(crumbs,nav){
  document.getElementById('crumbs').innerHTML=crumbs.map((c,i)=>(i?'<span class="sep">/</span>':'')+(c[1]?`<a href="${c[1]}">${esc(c[0])}</a>`:`<b>${esc(c[0])}</b>`)).join('');
  document.getElementById('barNav').innerHTML=(nav||[]).map(([t,h])=>`<a href="${h}">${esc(t)}</a>`).join('');
}

/* ===== Màn 1: Thư viện ===== */
function coverArt(sv,w,hh,seed){
  el('rect',{width:w,height:hh,fill:'url(#sky)'},sv);
  el('ellipse',{cx:w/2,cy:hh*.58,rx:w*.45,ry:hh*.36,fill:'#4b3bbd',opacity:.4,filter:'url(#blur)'},sv);
  stars(sv,Math.round(w*hh/1400),w,hh,seed);
  el('ellipse',{cx:w/2,cy:hh*.64,rx:w*.46,ry:hh*.34,fill:'none',stroke:'#9b8cff','stroke-dasharray':'6 6',opacity:.6},sv);
}
function renderHome(){
  setBar([['Thư viện']]);
  const s=STORIES.find(x=>x.id===store.get('lastStory'))||STORIES[0];useStory(s.id);
  const f=document.getElementById('feature');
  f.innerHTML=`<div class="feature-text">
      <span class="eyebrow">Truyện nổi bật</span>
      <h1>${esc(s.title)}</h1>
      <span class="meta">${esc(s.author)} · ${esc(s.genre)} · <a class="chref" href="${s.source}" target="_blank" rel="noopener">đọc truyện</a></span>
      <p class="sub">${esc(s.sub)}</p>
      <div class="stats"><div class="stat"><b>${s.worlds.length}</b><span>thế giới</span></div><div class="stat"><b>${s.links.length}</b><span>đường hầm</span></div><div class="stat"><b>${REALMS.length}</b><span>cảnh giới</span></div></div>
      <div class="actions"><a class="btn primary" href="#${s.id}">Mở bản đồ thế giới →</a><a class="btn" href="#${s.id}--${s.start}">Vào ${esc(short(byId[s.start].name))}</a></div>
    </div><a class="feature-art" href="#${s.id}" aria-label="Mở bản đồ ${esc(s.title)}"></a>`;
  const sv=el('svg',{viewBox:'0 0 560 420',preserveAspectRatio:'xMidYMid slice','aria-hidden':'true'});f.querySelector('.feature-art').appendChild(sv);
  coverArt(sv,560,420,5);
  [['sun',280,95,.85],['dragon',120,215,.85],['heaven',280,225,.8],['tree',440,215,.8],['demon',200,320,.7],['abyss',380,320,.7],['start',280,385,.7]].forEach(([k,x,y,sc])=>ART[k](el('g',{transform:`translate(${x},${y}) scale(${sc})`},sv)));

  const shelf=document.getElementById('shelf');shelf.innerHTML='';
  STORIES.forEach(st=>{
    const a=document.createElement('a');a.className='cover';a.href='#'+st.id;
    const c=el('svg',{viewBox:'0 0 300 400','aria-hidden':'true'});a.appendChild(c);coverArt(c,300,400,11);
    [['sun',150,90,.8],['dragon',80,220,.7],['demon',225,225,.7],['start',150,330,.7]].forEach(([k,x,y,sc])=>ART[k](el('g',{transform:`translate(${x},${y}) scale(${sc})`},c)));
    const cap=document.createElement('div');cap.className='cap';
    cap.innerHTML=`<span class="t">${esc(st.title)}</span><span class="meta">${esc(st.author)}</span><span class="meta">${st.worlds.length} thế giới · ${REALMS.length} cảnh giới</span>`;
    a.appendChild(cap);shelf.appendChild(a);
  });
  const add=document.createElement('div');add.className='cover empty';
  add.innerHTML='<span class="plus">+</span><b style="color:var(--ink)">Truyện tiếp theo</b><span class="meta">Gửi bản đồ hoặc danh sách thế giới cho Claude để thêm vào kệ.</span>';
  shelf.appendChild(add);
  document.getElementById('libCount').textContent=`${STORIES.length} truyện`;
}

/* ===== Màn 2: Bản đồ ===== */
function curve(a,b){const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy),k=.16*len,nx=-dy/len,ny=dx/len;return `M${a.x},${a.y} Q${mx+nx*k},${my+ny*k} ${b.x},${b.y}`}
let mapDrawnFor=null;
function showPreview(wid){
  const p=document.getElementById('preview');
  svgMap().querySelectorAll('.world').forEach(n=>n.classList.toggle('hl',n.dataset.id===wid));
  svgMap().querySelectorAll('.tunnel').forEach(n=>n.classList.toggle('on',!!wid&&(n.dataset.a===wid||n.dataset.b===wid)));
  if(!wid){p.innerHTML=`<div class="sec"><span class="eyebrow">Xem trước</span><p>Rê chuột hoặc chạm vào một vùng trên bản đồ để xem nhanh. Bấm lần nữa để vào thế giới đó.</p></div><div class="sec"><h3>Gợi ý</h3><p class="meta">Hành trình bắt đầu ở ${esc(short(byId[S.start].name))}, góc dưới bản đồ. Đường hầm vàng dẫn ra ngoài Cửu Châu vũ trụ.</p></div>`;return}
  const w=byId[wid],[a,b]=rangeOf(w),steps=(route(S.start,wid)||[wid]).length-1;
  p.innerHTML=`<div class="sec"><span class="eyebrow">Tầng ${w.tier} · ${esc(S.tiers[w.tier].name)}</span><h2 class="pname">${esc(w.name)}</h2><p>${esc(w.about)}</p></div>
    <div class="stats"><div class="stat"><b>${steps}</b><span>bước từ khởi đầu</span></div><div class="stat"><b>${adj[wid].length}</b><span>đường hầm</span></div><div class="stat"><b>${b-a+1}</b><span>cảnh giới</span></div></div>
    <p class="meta">Cảnh giới: ${esc(REALMS[a].name)} → ${esc(REALMS[b].name)}</p>
    <div><a class="btn primary" href="#${S.id}--${wid}">Vào ${esc(short(w.name))} →</a></div>`;
}
const svgMap=()=>document.getElementById('map');
function renderMap(){
  setBar([['Thư viện','#thu-vien'],[S.title]],[['Vào '+short(byId[S.start].name),`#${S.id}--${S.start}`]]);
  document.getElementById('storyTitle').textContent=S.title;
  const ups=S.links.filter(l=>l[2]==='up').length;
  document.getElementById('stats').innerHTML=`<div class="stat"><b>${S.worlds.length}</b><span>thế giới</span></div><div class="stat"><b>${S.links.length}</b><span>đường hầm</span></div><div class="stat"><b>${ups}</b><span>lối lên cấp cao</span></div>`;
  document.getElementById('tierList').innerHTML=[4,3,2,1].map(t=>{const ws=S.worlds.filter(w=>w.tier===t);
    return `<div class="grp"><span class="eyebrow">Tầng ${t} · ${esc(S.tiers[t].name)}</span><div class="chips">${ws.map(w=>`<a class="chip" data-pv="${w.id}" href="#${S.id}--${w.id}">${esc(w.name)}</a>`).join('')}</div></div>`}).join('');
  if(mapDrawnFor!==S.id){
    mapDrawnFor=S.id;
    const svg=svgMap();svg.innerHTML='';
    el('rect',{x:0,y:0,width:820,height:960,fill:'url(#sky)'},svg);
    [[150,170,190,110,'#4b3bbd',.45],[690,150,170,100,'#2a5fb5',.35],[420,620,260,180,'#3a2a8a',.35],[90,760,160,120,'#1f6b8a',.35],[760,800,150,120,'#6a2a7a',.3]].forEach(([cx,cy,rx,ry,c,o])=>el('ellipse',{cx,cy,rx,ry,fill:c,opacity:o,filter:'url(#blur)'},svg));
    const st=stars(svg,320,820,960,2024);[[60,60],[770,420],[30,880],[790,40]].forEach(([x,y])=>sparkle(st,x,y));
    const rg=S.ring;
    el('ellipse',{cx:rg.cx,cy:rg.cy,rx:rg.rx,ry:rg.ry,fill:'#6a5cff',opacity:.05},svg);
    el('ellipse',{cx:rg.cx,cy:rg.cy,rx:rg.rx,ry:rg.ry,fill:'none',stroke:'#9b8cff','stroke-width':1.6,'stroke-dasharray':'8 7',opacity:.7},svg);
    el('text',{x:rg.lx,y:rg.ly,'text-anchor':'middle','font-family':'Cormorant Garamond, Georgia, serif','font-size':22,'font-weight':700,'letter-spacing':2,fill:'#d9d3ff'},svg).textContent=rg.label;
    const tl=el('g',{},svg);
    S.links.forEach(([a,b,t])=>{
      const A=byId[a],B=byId[b],c=t==='up'?'#f2c76e':'#8fd6ff',d=curve(A,B),g=el('g',{class:'tunnel','data-a':a,'data-b':b},tl);
      el('path',{d,class:'halo',stroke:c,filter:'url(#glow)'},g);
      const core=el('path',{d,class:'core',stroke:c},g),L=core.getTotalLength();
      [.2,.8].forEach(f=>{const p=core.getPointAtLength(L*f);el('ellipse',{cx:p.x,cy:p.y,rx:7,ry:3.5,fill:'#0a0b22',stroke:c,'stroke-width':2,filter:'url(#glow)'},g)});
    });
    const wl=el('g',{},svg);
    S.worlds.forEach(w=>{
      const g=el('g',{class:'world',tabindex:0,role:'link','aria-label':'Vào '+w.name,'data-id':w.id,transform:`translate(${w.x},${w.y})`},wl);
      el('rect',{class:'hit',x:-80,y:-90,width:160,height:170},g);
      ART[w.kind](el('g',{class:'art'},g));
      const ly=w.kind==='nine'?52:['sea','isles','abyss'].includes(w.kind)?48:72;
      el('text',{class:'label',x:0,y:ly},g).textContent=w.name;
      // Chuột: rê để xem trước, bấm để vào. Cảm ứng: chạm lần 1 xem trước, lần 2 vào.
      g.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')showPreview(w.id)});
      g.addEventListener('focus',()=>showPreview(w.id));
      g.addEventListener('click',e=>{if(e.pointerType&&e.pointerType!=='mouse'&&pvSel!==w.id){pvSel=w.id;showPreview(w.id);return}go(`${S.id}--${w.id}`)});
      g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go(`${S.id}--${w.id}`)}});
    });
  }
  pvSel=null;showPreview(null);
}
let pvSel=null;
document.getElementById('tierList').addEventListener('mouseover',e=>{const c=e.target.closest('[data-pv]');if(c)showPreview(c.dataset.pv)});

/* ===== Màn 3: Thế giới ===== */
function renderScene(w){
  const svg=document.getElementById('scene'),[top,bot,neb]=SKY[w.kind];
  svg.setAttribute('aria-label','Cảnh quan '+w.name);svg.innerHTML='';
  el('defs',{},svg).innerHTML=`<linearGradient id="sceneSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${bot}"/></linearGradient>`;
  el('rect',{width:800,height:440,fill:'url(#sceneSky)'},svg);
  const r=rng(w.id.length*97+w.x);
  for(let i=0;i<4;i++)el('ellipse',{cx:r()*800,cy:r()*300,rx:120+r()*120,ry:70+r()*60,fill:neb,opacity:.22,filter:'url(#blur)'},svg);
  const st=stars(svg,170,800,440,w.x*3+w.y);sparkle(st,60,50,6);sparkle(st,740,70,5);
  el('ellipse',{cx:400,cy:470,rx:520,ry:90,fill:neb,opacity:.18,filter:'url(#soft)'},svg);
  [[150,120,.3],[650,250,.26],[560,90,.2]].forEach(([x,y,s])=>{const g=el('g',{transform:`translate(${x},${y}) scale(${s})`,opacity:.5},svg);island(g,120,bot)});
  ART[w.kind](el('g',{transform:`translate(470,${w.kind==='sun'||w.kind==='galaxy'?225:215}) scale(2.2)`},svg));
  // Cổng không gian sang các giới kề bên (tránh góc dưới trái nơi đặt tiêu đề)
  const slots=[[720,320],[720,170],[90,110],[300,70]];
  adj[w.id].forEach((n,i)=>{
    const [x,y]=slots[i],up=linkType(w.id,n)==='up',c=up?'#f2c76e':'#8fd6ff';
    const g=el('g',{class:'portal',tabindex:0,role:'link','aria-label':'Sang '+byId[n].name,transform:`translate(${x},${y})`},svg);
    el('ellipse',{cx:0,cy:0,rx:26,ry:10,fill:'#05060f',stroke:c,'stroke-width':3,filter:'url(#glow)'},g);
    el('ellipse',{cx:0,cy:-30,rx:16,ry:34,fill:c,opacity:.18,filter:'url(#soft)'},g);
    el('text',x>400?{x:30,y:-22,style:'text-anchor:end'}:{x:-30,y:-22,style:'text-anchor:start'},g).textContent=(up?'⇡ ':'')+short(byId[n].name);
    bindOpen(g,()=>go(`${S.id}--${n}`));
  });
}

function renderLadder(w){
  const [a,b]=rangeOf(w),box=document.getElementById('ladder');
  document.getElementById('realmRange').textContent=w.rGuess
    ?`Từ ${REALMS[a].name} tới ${REALMS[b].name}. Ước lượng, vì chưa có chương nói rõ cảnh giới ở đây. Bấm một bậc để xem cách đột phá.`
    :`Cảnh giới của Lâm Phong trong các chương ở thế giới này: ${REALMS[a].name} → ${REALMS[b].name}. Bấm một bậc để xem cách đột phá.`;
  document.getElementById('towerBadge').innerHTML=w.rGuess?'<span class="badge guess">ước lượng</span>':'<span class="badge src">theo mốc chương</span>';
  const list=REALMS.map((r,i)=>({r,i})).filter(({i})=>showAll||(i>=a&&i<=b));
  const groups=[];list.forEach(x=>{const last=groups[groups.length-1];if(last&&last.g===x.r.g)last.items.push(x);else groups.push({g:x.r.g,items:[x]})});
  box.innerHTML=groups.reverse().map(gr=>{const G=GBY[gr.g];
    return `<div class="grp"><span class="grp-name"><i style="background:${G.c}"></i>${esc(G.name)} · ${esc(G.han)}</span><div class="rungs">${
      gr.items.map(({r,i})=>`<button type="button" class="rung${i<a||i>b?' out':''}" data-realm="${r.id}" aria-pressed="${r.id===curRealm}" style="--c:${G.c}"><span class="n">${i+1}</span><span>${esc(r.name)} <span class="lv">${esc(r.han)}</span></span><span class="lv">${esc(r.lv)}</span></button>`).join('')}</div></div>`}).join('');
  document.getElementById('toggleAll').textContent=showAll?'Chỉ hiện cảnh giới của thế giới này':`Hiện toàn bộ ${REALMS.length} cảnh giới`;
}

function levelViz(r,c){
  if(/^10 trọng/.test(r.lv))return `<div class="dots" style="--c:${c}" aria-hidden="true">${'<i></i>'.repeat(10)}</div><div class="lvl-cap"><span>Nhất trọng</span><span>Thập trọng → đột phá</span></div>`;
  if(/^99/.test(r.lv))return `<div class="ticks" style="--c:${c}" aria-hidden="true">${'<i></i>'.repeat(99)}</div><div class="lvl-cap"><span>Tầng 1</span><span>Tầng 99 → độ kiếp</span></div>`;
  if(r.lv.includes('·'))return `<div class="flow">${r.lv.split('·').map(x=>`<span>${esc(x.trim())}</span>`).join('<span class="arrow" style="border:0;padding:0">→</span>')}</div>`;
  return '';
}

function renderRealm(){
  const i=RIDX[curRealm],r=REALMS[i],G=GBY[r.g],next=REALMS[i+1],prev=REALMS[i-1];
  const tag=k=>k==='t'?'<span class="badge src">theo truyện</span>':k==='w'?'<span class="badge web">bách khoa</span>':'<span class="badge guess">diễn giải</span>';
  const p=document.getElementById('realmPanel');
  p.innerHTML=`
    <div class="sec"><span class="eyebrow" style="color:${G.c}">Bậc ${i+1}/${REALMS.length} · ${esc(G.name)}</span>
      <h2 class="rname">${esc(r.name)}<small>${esc(r.han)}</small></h2>
      <div class="flow">${prev?`<span>${esc(prev.name)}</span><span class="arrow" style="border:0;padding:0">→</span>`:''}<span class="me">${esc(r.name)}</span>${next?`<span class="arrow" style="border:0;padding:0">→</span><span>${esc(next.name)}</span>`:''}</div></div>
    ${r.lf?`<p class="meta">Lâm Phong đạt cảnh giới này ở ${chLink(r.lf)}</p>`:''}
    <div class="sec"><h3>Phân tầng ${tag(r.tLv)}</h3><p>${esc(r.lv)}</p>${levelViz(r,G.c)}</div>
    <div class="sec"><h3>Đặc điểm ${tag(r.tTrait)}</h3><p>${esc(r.trait)}</p></div>
    <div class="sec"><h3>Cách đột phá ${tag(r.tHow)}</h3>
      <div class="step"><span class="to">${esc(r.name)} → <b>${next?esc(next.name):'Đỉnh hệ thống'}</b></span><p>${esc(r.how)}</p>
      ${r.kiep?`<p class="kiep">Kiếp phải độ: ${esc(r.kiep)}</p>`:''}</div>
      ${r.ch.length?`<div class="refs"><span class="meta" style="margin-right:6px">Đọc thêm:</span>${r.ch.map(chLink).join('')}</div>`:''}</div>
    <div class="nav2"><button type="button" data-step="-1" ${prev?'':'disabled'}>↓ ${prev?esc(prev.name):''}</button><button type="button" data-step="1" ${next?'':'disabled'}>${next?esc(next.name):''} ↑</button></div>
    <div class="sec"><h3><label for="rnote">Ghi chú của bạn</label></h3>
      <textarea id="rnote" placeholder="Chương đột phá, ai đạt ${esc(r.name)}, chi tiết bạn đọc được…">${esc(store.get(`rnote:${S.id}:${r.id}`)||'')}</textarea><span class="saved" id="rsaved"></span></div>
    <p class="meta">"Theo truyện": tóm tắt từ chương truyện (bản convert). "Bách khoa": từ bách khoa trên web. "Diễn giải": suy ra từ tên gọi.</p>`;
  const ta=p.querySelector('#rnote'),sv=p.querySelector('#rsaved');let t;
  ta.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(()=>{sv.textContent=store.set(`rnote:${S.id}:${r.id}`,ta.value)?'Đã lưu trên trình duyệt này':'Trình duyệt không cho lưu ghi chú'},400)});
  document.querySelectorAll('.rung').forEach(b=>b.setAttribute('aria-pressed',b.dataset.realm===curRealm));
}

function renderWorld(wid){
  const w=byId[wid];curWorld=wid;
  const [lo,hi]=rangeOf(w);const saved=store.get(`realm:${S.id}:${wid}`);curRealm=saved&&saved in RIDX?saved:REALMS[lo].id;
  const order=S.worlds.map(x=>x.id),k=order.indexOf(wid),pw=byId[order[(k-1+order.length)%order.length]],nw=byId[order[(k+1)%order.length]];
  setBar([['Thư viện','#thu-vien'],[S.title,'#'+S.id],[short(w.name)]],[['← '+short(pw.name),`#${S.id}--${pw.id}`],[short(nw.name)+' →',`#${S.id}--${nw.id}`]]);
  document.getElementById('wTier').textContent=`Tầng ${w.tier} · ${S.tiers[w.tier].name} · ${w.type}`;
  document.getElementById('wName').textContent=w.name;
  document.getElementById('wAbout').textContent=w.about;
  renderScene(w);
  document.getElementById('dossier').innerHTML=
    `<figure class="quote" style="margin:0"><q>${esc(w.quote[0])}</q><figcaption class="meta">Nguyên văn bản convert, ${chLink(w.quote[1])}</figcaption></figure>`+
    w.secs.map(([h,t,chs])=>`<section class="card${h.startsWith('Lâm Phong')?' lp':''}"><h3>${esc(h)}</h3><p>${esc(t)}</p><div class="refs">${chs.map(chLink).join('')}</div></section>`).join('');
  const facts=[['Loại không gian',w.type],['Vị trí',(w.tier===4?'Ngoài':'Trong')+' Cửu Châu vũ trụ · '+S.tiers[w.tier].name],[w.rGuess?'Cảnh giới (ước lượng)':'Cảnh giới Lâm Phong khi ở đây',`${REALMS[lo].name} → ${REALMS[hi].name}`],['Đường hầm',`${adj[wid].length} lối (${adj[wid].filter(n=>linkType(wid,n)==='up').length} lối vàng)`],['Biểu tượng trên bản đồ',w.sym]];
  document.getElementById('wFacts').innerHTML=facts.map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('');
  const path=route(S.start,wid)||[wid],steps=path.length-1;
  document.getElementById('routeHead').textContent='Đường đi từ '+short(byId[S.start].name);
  let h='';path.forEach((p,i)=>{if(i){const up=linkType(path[i-1],p)==='up';h+=`<span class="arrow${up?' up':''}" aria-hidden="true">${up?'⇡':'→'}</span>`}h+=`<a class="chip${p===wid?' cur':''}" href="#${S.id}--${p}">${esc(short(byId[p].name))}</a>`});
  document.getElementById('wRoute').innerHTML=steps?h:'';
  const ups=path.slice(1).filter((p,i)=>linkType(path[i],p)==='up').length;
  document.getElementById('wRouteMeta').textContent=steps?`${steps} lần qua đường hầm${ups?`, trong đó ${ups} lần lên cấp cao hơn`:''}.`:'Đây là nơi hành trình bắt đầu.';
  document.getElementById('wNear').innerHTML=adj[wid].map(n=>`<a class="chip${linkType(wid,n)==='up'?' gold':''}" href="#${S.id}--${n}">${esc(short(byId[n].name))}</a>`).join('');
  renderLadder(w);renderRealm();
}

document.getElementById('ladder').addEventListener('click',e=>{const b=e.target.closest('[data-realm]');if(!b)return;curRealm=b.dataset.realm;store.set(`realm:${S.id}:${curWorld}`,curRealm);renderRealm();if(window.matchMedia('(max-width:720px)').matches)document.getElementById('realmPanel').scrollIntoView({behavior:'smooth',block:'start'})});
document.getElementById('realmPanel').addEventListener('click',e=>{const b=e.target.closest('[data-step]');if(!b||b.disabled)return;const i=RIDX[curRealm]+Number(b.dataset.step);curRealm=REALMS[i].id;store.set(`realm:${S.id}:${curWorld}`,curRealm);const [a,z]=rangeOf(byId[curWorld]);if(i<a||i>z)showAll=true;renderLadder(byId[curWorld]);renderRealm()});
document.getElementById('toggleAll').addEventListener('click',()=>{showAll=!showAll;renderLadder(byId[curWorld]);renderRealm()});

/* ===== Điều hướng theo #hash ===== */
function show(v){['vHome','vMap','vWorld'].forEach(id=>document.getElementById(id).hidden=id!==v)}
function router(){
  const [sid,wid]=decodeURIComponent(location.hash.slice(1)).split('--');
  if(sid&&useStory(sid)){
    if(wid&&byId[wid]){showAll=false;show('vWorld');renderWorld(wid)}
    else{show('vMap');renderMap()}
  }else{show('vHome');renderHome()}
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',router);
router();
</script>
</body>
</html>
